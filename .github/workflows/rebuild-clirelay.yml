name: Rebuild cpam Image

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cpam docker publish workflow
        env:
          GH_TOKEN: ${{ secrets.CLIRELAY_WORKFLOW_TOKEN }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "CLIRELAY_WORKFLOW_TOKEN is not configured; skip triggering Pinevu/cpam workflow."
            exit 0
          fi

          gh workflow run docker-publish.yml \
            --repo Pinevu/cpam \
            --ref "${TARGET_REF}"

          echo "Triggered Pinevu/cpam docker-publish.yml for ${TARGET_REF}"
